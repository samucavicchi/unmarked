# Decap CMS configuration
# https://decapcms.org/docs/configuration-options/

backend:
  name: git-gateway
  branch: main

# Le foto caricate dal CMS finiscono in src/assets/articoli/
media_folder: "src/assets/articoli"
public_folder: "../../assets/articoli"

site_url: https://tourmaline-tartufo-0cbf4c.netlify.app
display_url: https://tourmaline-tartufo-0cbf4c.netlify.app
logo_url: https://tourmaline-tartufo-0cbf4c.netlify.app/favicon.svg

locale: 'it'

collections:
  - name: "destinazioni"
    label: "Destinazioni"
    label_singular: "Destinazione"
    folder: "src/content/destinazioni"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{country}}"
    sortable_fields: ["publishDate", "title", "country"]
    fields:
      - { label: "Titolo", name: "title", widget: "string", hint: "Es. 'Cinque valli silenziose nei Pirenei catalani'" }
      - { label: "Sottotitolo", name: "subtitle", widget: "string", required: false, hint: "Occhiello sopra il titolo, opzionale" }
      - { label: "Paese", name: "country", widget: "string", hint: "Es. 'Spagna', 'Kirghizistan', 'Italia'" }
      - { label: "Continente", name: "continent", widget: "select", options: ["Europa", "Asia", "Africa", "Americhe", "Oceania"] }
      - { label: "Regione", name: "region", widget: "string", required: false, hint: "Sotto-area, es. 'Pirenei catalani'" }
      - { label: "Foto copertina", name: "coverImage", widget: "image" }
      - { label: "Alt copertina", name: "coverImageAlt", widget: "string", hint: "Descrizione testuale per SEO e accessibilità" }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "150-200 caratteri. Appare nelle card" }
      - { label: "Data pubblicazione", name: "publishDate", widget: "datetime", date_format: "DD/MM/YYYY", time_format: false, format: "YYYY-MM-DD" }
      - { label: "In primo piano", name: "featured", widget: "boolean", default: false, hint: "Se attivo, l'articolo appare in posizione hero in homepage" }
      - { label: "SEO meta description", name: "seoMetaDescription", widget: "text", required: false }
      - {
          label: "Corpo articolo",
          name: "body",
          widget: "markdown",
          hint: "Il corpo del reportage. Puoi alternare paragrafi, intertitoli, foto e citazioni.",
          buttons: ["bold", "italic", "link", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list"],
          editor_components: ["image"],
        }

  - name: "itinerari"
    label: "Itinerari"
    label_singular: "Itinerario"
    folder: "src/content/itinerari"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titolo", name: "title", widget: "string" }
      - { label: "Sottotitolo", name: "subtitle", widget: "string", required: false }
      - { label: "Paese", name: "country", widget: "string" }
      - { label: "Continente", name: "continent", widget: "select", options: ["Europa", "Asia", "Africa", "Americhe", "Oceania"] }
      - { label: "Foto copertina", name: "coverImage", widget: "image" }
      - { label: "Alt copertina", name: "coverImageAlt", widget: "string" }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Data pubblicazione", name: "publishDate", widget: "datetime", date_format: "DD/MM/YYYY", time_format: false, format: "YYYY-MM-DD" }
      - { label: "Durata (giorni)", name: "duration", widget: "number", value_type: "int", min: 1, max: 60 }
      - { label: "Budget", name: "budget", widget: "select", options: ["Economico", "Medio", "Alto"] }
      - { label: "Difficoltà", name: "difficulty", widget: "select", options: ["Facile", "Medio", "Avventura"] }
      - { label: "Periodo migliore", name: "bestSeason", widget: "string", hint: "Es. 'Maggio-Settembre'" }
      - { label: "Trasporto", name: "transport", widget: "string", hint: "Es. 'Auto a noleggio + bus locali'" }
      - { label: "Prezzo (€)", name: "price", widget: "number", value_type: "int", min: 5, max: 50 }
      - { label: "Lemon Squeezy Product ID", name: "lemonSqueezyProductId", widget: "string", required: false }
      - { label: "Vale il viaggio", name: "valeIlViaggio", widget: "text", required: false }
      - { label: "Mainstream check", name: "mainstreamCheck", widget: "text", required: false }
      - { label: "Corpo itinerario", name: "body", widget: "markdown" }

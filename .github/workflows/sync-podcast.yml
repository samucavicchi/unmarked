name: Sync Podcast

on:
  schedule:
    - cron: '0 8 * * *'   # ogni giorno alle 08:00 UTC
  workflow_dispatch:        # avviabile anche a mano da GitHub → Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync episodi dal feed RSS
        run: node scripts/sync-podcast.js
        env:
          RSS_URL: https://anchor.fm/s/112725408/podcast/rss

      - name: Commit nuovi episodi (se presenti)
        run: |
          git config user.name "Unmarked Bot"
          git config user.email "bot@unmarked.it"
          git add src/content/podcast/
          git diff --staged --quiet || (git commit -m "podcast: nuovi episodi da RSS" && git push)
